
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: create .env file
      env:
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        MONGO_URI: ${{ secrets.MONGO_URI }}
        BANK_NAME: ${{ secrets.BANK_NAME }}
        BANK_BRANCH: ${{ secrets.BANK_BRANCH }}
        BANK_ACCOUNT_HOLDER: ${{ secrets.BANK_ACCOUNT_HOLDER }}
        BANK_ACCOUNT_NUMBER: ${{ secrets.BANK_ACCOUNT_NUMBER }}
        DELIVERY_FEE_LKR: ${{ vars.DELIVERY_FEE_LKR }}
      run: |
        echo "$JWT_SECRET_KEY" > .env
        echo "$MONGO_URI" >> .env
        printf 'BANK_NAME=%s\n' "$BANK_NAME" >> .env
        printf 'BANK_BRANCH=%s\n' "$BANK_BRANCH" >> .env
        printf 'BANK_ACCOUNT_HOLDER=%s\n' "$BANK_ACCOUNT_HOLDER" >> .env
        printf 'BANK_ACCOUNT_NUMBER=%s\n' "$BANK_ACCOUNT_NUMBER" >> .env
        printf 'DELIVERY_FEE_LKR=%s\n' "$DELIVERY_FEE_LKR" >> .env
    - run: npm run build --if-present
    - run: npm run test --if-present
